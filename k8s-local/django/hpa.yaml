apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-auth
  namespace: django-auth

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-auth

  minReplicas: 3
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70