apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail

rules:
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - services
    - namespaces
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail

subjects:
- kind: ServiceAccount
  name: promtail
  namespace: logging

roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io