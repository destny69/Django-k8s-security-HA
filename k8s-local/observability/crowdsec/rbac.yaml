apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec

rules:
- apiGroups: [""]
  resources:
    - pods
    - namespaces
    - services
    - nodes
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec

subjects:
- kind: ServiceAccount
  name: crowdsec
  namespace: crowdsec

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec