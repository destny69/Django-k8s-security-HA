apiVersion: apps/v1
kind: Deployment

metadata:
  name: crowdsec-lapi
  namespace: crowdsec

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crowdsec-lapi

  template:

    metadata:
      labels:
        app: crowdsec-lapi

    spec:

      serviceAccountName: crowdsec

      containers:

      - name: crowdsec

        image: crowdsecurity/crowdsec:latest

        env:

        - name: COLLECTIONS
          value: |
            crowdsecurity/traefik

        ports:

        - containerPort: 8080

        volumeMounts:

        - name: config
          mountPath: /etc/crowdsec/acquis.yaml
          subPath: acquis.yaml

        - name: config
          mountPath: /etc/crowdsec/profiles.yaml.local
          subPath: profiles.yaml

      volumes:

      - name: config
        configMap:
          name: crowdsec-config