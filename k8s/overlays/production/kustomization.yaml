---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: django-auth

bases:
  - ../../

commonLabels:
  environment: production

replicas:
  - name: django-app
    count: 3
  - name: postgres
    count: 1
  - name: traefik
    count: 1
  - name: waf
    count: 1

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: HorizontalPodAutoscaler
    metadata:
      name: django-app-hpa
    spec:
      minReplicas: 3
      maxReplicas: 10
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 60
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 75

  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: django-app
    spec:
      template:
        spec:
          containers:
          - name: django-app
            resources:
              requests:
                memory: "512Mi"
                cpu: "300m"
              limits:
                memory: "1Gi"
                cpu: "600m"

  - |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-pvc
    spec:
      resources:
        requests:
          storage: 50Gi

resources:
  - configmap-prod.yaml
  - pdb.yaml
