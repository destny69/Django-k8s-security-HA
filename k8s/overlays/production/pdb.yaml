---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: django-app-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: django-app

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: traefik-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: traefik
